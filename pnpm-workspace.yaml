ignoredBuiltDependencies:
  - '@paymoapp/electron-shutdown-handler'
  - '@thaunknown/yencode'
  - bufferutil
  - electron
  - node-datachannel
  - protobufjs
  - utf-8-validate
  - utp-native

onlyBuiltDependencies:
  - esbuild

# app-builder-lib loads this peer only for squirrel targets. Without this, pnpm installs an old electron-builder 25 copy.
packageExtensions:
  app-builder-lib:
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
